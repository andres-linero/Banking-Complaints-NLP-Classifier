[project]
name = "banking-complaints-nlp"
version = "0.1.0"
description = "NLP workflow for classifying banking complaints and sentiment."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3,<2.0",
    "nltk>=3.8,<4.0",
    "vaderSentiment>=3.3,<4.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",
    "spacy>=3.7,<3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.7,<3.0",
    "streamlit>=1.35,<2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.0,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.4,<1.0",
]
# Optional, heavier dependencies for BERT fine-tuning: uv sync --group bert
bert = [
    "torch>=2.2",
    "transformers>=4.40,<5.0",
    "datasets>=2.18,<4.0",
    "accelerate>=0.30",
    "evaluate>=0.4,<1.0",
]
# Official MCP Python SDK: uv sync --group mcp
mcp = [
    "mcp[cli]>=1.27,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
