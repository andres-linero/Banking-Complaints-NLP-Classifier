[project]
name = "banking-complaints-nlp"
version = "0.2.0"
description = "Route banking complaints to the right product team from text."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.7,<3.0",
    "streamlit>=1.35,<2.0",
    "pyyaml>=6.0,<7.0",
    "pyarrow>=15.0",
    "mlflow>=2.12,<4.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.4,<1.0",
]
# Only for opening the historical notebook under notebooks/: uv sync --group notebook
notebook = [
    "nltk>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "spacy>=3.7,<3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "vaderSentiment>=3.3,<4.0",
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.0,<2.0",
]
# Official MCP Python SDK, for the MCP door: uv sync --group mcp
mcp = [
    "mcp[cli]>=1.27,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["complaints*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
