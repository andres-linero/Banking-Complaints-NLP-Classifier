<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 490" width="1300" height="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Training map: the data path runs once from the raw CSV through ingest, wrangle, and freeze; the model path fits TF-IDF and logistic regression on the train rows, evaluates once on the test rows, and serves through a predictor that routes to a team mailbox or a review queue.">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect width="1300" height="490" fill="#fbfaf7"/>
  <text x="40" y="34" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">DATA PROCESSING · RUNS ONCE</text>
  <text x="288" y="284" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">MODEL PATH · THE ONE MODEL THAT SHIPS</text>
  <rect x="40" y="50" width="224" height="160" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <path d="M 48 50 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#475569"/>
  <text x="54" y="72" font-size="14" font-weight="700" fill="#ffffff">Raw data</text>
  <text x="54" y="108" font-size="13" font-weight="700" fill="#1f2937">Source CSV</text>
  <text x="54" y="130" font-size="12" fill="#1f2937">7,011 complaints · 17 raw labels</text>
  <text x="54" y="148" font-size="12" fill="#1f2937">the text plus the product</text>
  <text x="54" y="166" font-size="12" fill="#1f2937">it was filed under</text>
  <text x="54" y="194" font-size="11" font-family="Menlo, Consolas, monospace" fill="#475569">complaints_banking_2023.csv</text>
  <line x1="264" y1="130" x2="286" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="288" y="50" width="224" height="160" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M 296 50 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#b45309"/>
  <text x="302" y="72" font-size="14" font-weight="700" fill="#ffffff">1 · Ingest</text>
  <text x="302" y="108" font-size="13" font-weight="700" fill="#1f2937">Load and audit</text>
  <text x="302" y="130" font-size="12" fill="#1f2937">Type every column, count</text>
  <text x="302" y="148" font-size="12" fill="#1f2937">nulls, duplicates, text length</text>
  <text x="302" y="194" font-size="11" font-family="Menlo, Consolas, monospace" fill="#b45309">ingest.py · data_study.py</text>
  <line x1="512" y1="130" x2="534" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="536" y="50" width="224" height="160" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M 544 50 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#b45309"/>
  <text x="550" y="72" font-size="14" font-weight="700" fill="#ffffff">2 · Wrangle</text>
  <text x="550" y="108" font-size="13" font-weight="700" fill="#1f2937">Clean text, map labels</text>
  <text x="550" y="130" font-size="12" fill="#1f2937">17 labels → 7 classes</text>
  <text x="550" y="148" font-size="12" fill="#1f2937">masks collapsed, short and</text>
  <text x="550" y="166" font-size="12" fill="#1f2937">duplicate rows dropped</text>
  <text x="550" y="194" font-size="11" font-family="Menlo, Consolas, monospace" fill="#b45309">clean.py → clean.parquet</text>
  <line x1="760" y1="130" x2="782" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="784" y="50" width="224" height="160" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M 792 50 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#b45309"/>
  <text x="798" y="72" font-size="14" font-weight="700" fill="#ffffff">3 · Freeze</text>
  <text x="798" y="108" font-size="13" font-weight="700" fill="#1f2937">Split once, never again</text>
  <text x="798" y="130" font-size="12" fill="#1f2937">80 / 20, stratified, seed 42</text>
  <text x="798" y="148" font-size="12" fill="#1f2937">the test rows are read by</text>
  <text x="798" y="166" font-size="12" fill="#1f2937">Evaluate only</text>
  <text x="798" y="194" font-size="11" font-family="Menlo, Consolas, monospace" fill="#b45309">split.py → train · test.parquet</text>
  <rect x="40" y="300" width="224" height="160" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <path d="M 48 300 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#475569"/>
  <text x="54" y="322" font-size="14" font-weight="700" fill="#ffffff">Training data</text>
  <text x="54" y="358" font-size="13" font-weight="700" fill="#1f2937">train.parquet</text>
  <text x="54" y="380" font-size="12" fill="#1f2937">5,551 rows · text and class,</text>
  <text x="54" y="398" font-size="12" fill="#1f2937">nothing else</text>
  <text x="54" y="444" font-size="11" font-family="Menlo, Consolas, monospace" fill="#475569">data/processed/</text>
  <line x1="264" y1="380" x2="286" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="288" y="300" width="224" height="160" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M 296 300 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#047857"/>
  <text x="302" y="322" font-size="14" font-weight="700" fill="#ffffff">4 · Vectorize</text>
  <text x="302" y="358" font-size="13" font-weight="700" fill="#1f2937">Text → numbers</text>
  <text x="302" y="380" font-size="12" fill="#1f2937">TF-IDF over words and word</text>
  <text x="302" y="398" font-size="12" fill="#1f2937">pairs, 50k terms, fitted on</text>
  <text x="302" y="416" font-size="12" fill="#1f2937">the train rows only</text>
  <text x="302" y="444" font-size="11" font-family="Menlo, Consolas, monospace" fill="#047857">vectorize.py · baseline.yaml</text>
  <line x1="512" y1="380" x2="534" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="536" y="300" width="224" height="160" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M 544 300 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#047857"/>
  <text x="550" y="322" font-size="14" font-weight="700" fill="#ffffff">5 · Train</text>
  <text x="550" y="358" font-size="13" font-weight="700" fill="#1f2937">Logistic regression</text>
  <text x="550" y="380" font-size="12" fill="#1f2937">7 classes, balanced weights,</text>
  <text x="550" y="398" font-size="12" fill="#1f2937">real probabilities</text>
  <text x="550" y="416" font-size="12" fill="#1f2937">5-fold check, then one fit</text>
  <text x="550" y="444" font-size="11" font-family="Menlo, Consolas, monospace" fill="#047857">train.py → baseline.joblib</text>
  <line x1="760" y1="380" x2="782" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="784" y="300" width="224" height="160" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M 792 300 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#6d28d9"/>
  <text x="798" y="322" font-size="14" font-weight="700" fill="#ffffff">6 · Evaluate</text>
  <text x="798" y="358" font-size="13" font-weight="700" fill="#1f2937">Score the test set once</text>
  <text x="798" y="380" font-size="12" fill="#1f2937">accuracy 0.825 · macro-F1 0.806</text>
  <text x="798" y="398" font-size="12" fill="#1f2937">confusion matrix, per-class F1,</text>
  <text x="798" y="416" font-size="12" fill="#1f2937">threshold sweep</text>
  <text x="798" y="444" font-size="11" font-family="Menlo, Consolas, monospace" fill="#6d28d9">evaluate.py → reports/evaluate/</text>
  <line x1="1008" y1="380" x2="1030" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1032" y="300" width="224" height="160" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M 1040 300 h 208 a 8 8 0 0 1 8 8 v 24 h -224 v -24 a 8 8 0 0 1 8 -8 z" fill="#1d4ed8"/>
  <text x="1046" y="322" font-size="14" font-weight="700" fill="#ffffff">7 · Serve</text>
  <text x="1046" y="358" font-size="13" font-weight="700" fill="#1f2937">Predict and route</text>
  <text x="1046" y="380" font-size="12" fill="#1f2937">class + confidence →</text>
  <text x="1046" y="398" font-size="12" fill="#1f2937">team mailbox · under 0.75 →</text>
  <text x="1046" y="416" font-size="12" fill="#1f2937">review queue for a person</text>
  <text x="1046" y="444" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1d4ed8">predictor.py · API · MCP · app</text>
  <path d="M 854 210 V 259 H 152 V 298" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="164" y="253" font-size="11" fill="#b45309">train.parquet → training</text>
  <line x1="948" y1="210" x2="948" y2="298" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="956" y="281" font-size="11" fill="#6d28d9">test.parquet → evaluate only</text>
  </svg>
